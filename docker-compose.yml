version: '3.9'

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: churn-backend

    ports:
      - "8000:8000"

    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: churn-frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: always